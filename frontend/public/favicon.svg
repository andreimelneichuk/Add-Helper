<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Cobalt Tile with rounded corners (26% radius) -->
  <rect width="512" height="512" rx="130" fill="#2340d9"/>
  
  <!-- Optical Centering Offset: dx = -14, dy = -10 -->
  <g transform="translate(-14, -10)">
    <!-- Friendly Soft Megaphone (Advertising / Reach) -->
    <g fill="#ffffff">
      <!-- Speaker Body (Soft rounded cone) -->
      <path d="M 164 196 
               C 146 196, 132 210, 132 228 
               L 132 284 
               C 132 302, 146 316, 164 316 
               L 182 316 
               L 282 374 
               C 292 380, 306 372, 306 360 
               L 306 152 
               C 306 140, 292 132, 282 138 
               L 182 196 
               Z" />
               
      <!-- Capsule Handle (rx = half width) -->
      <rect x="188" y="312" width="30" height="72" rx="15" />
    </g>
    
    <!-- Radiating Reach Waves (Smooth rounded stroke pills) -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M 346 202 A 76 76 0 0 1 346 310" stroke-width="26" />
      <path d="M 392 164 A 136 136 0 0 1 392 348" stroke-width="26" />
    </g>
  </g>
</svg>