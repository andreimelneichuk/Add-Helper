# Варианты идут одновременно в одной группе объявлений, Яндекс сам делит показы
# (tasks/05-native-ab-testing.md, docs/04-autopilot.md §5). Изменение порогов = новая версия файла.
version = "experiments-2"

# Порог ниже, чем у чередования: оба варианта набирают данные каждый день, а не через день.
# Цена ошибки ограничена: проигравший приостанавливается, не удаляется, его можно включить.
win_probability_bp = 8000
lose_probability_bp = 2000
# Неделя: оба варианта проходят все дни недели.
min_days = 7
max_days = 21
# 50 кликов на вариант, 100 на группу: при 10–15 кликах в день это около недели.
min_clicks_per_variant = 50
# Предел трат на тест, микроединицы: калибруется на пилоте.
max_test_spend = 30000000000
# Переключений нет, отсекать часы после смены варианта не нужно. Неполный день старта
# в сравнение не идёт: его отсекает источник статистики.
exclusion_hours = 0
