# Карточки «Сегодня»: docs/10-redesign.md §4. Меньше число — выше карточка.
# today-3: итог A/B-теста неделю после него (tasks/05-native-ab-testing.md, docs/04 §5).
version = "today-3"
# Лента конечна: до 5 карточек, дальше «На сегодня всё».
max_cards = 5
# Своё последнее действие и итог теста напоминаем неделю: позже — в истории.
last_action_days = 7
# Новый вид тревоги без своего места встаёт сюда, а не теряется.
unknown_alert = 55

[priority]
"alert:balance_mismatch" = 10
"alert:budget_stop_pending" = 10
"alert:zero_balance" = 20
"alert:platform_not_connected" = 30
"alert:budget_stopped" = 40
"alert:platform_unavailable" = 50
"alert:ads_need_confirmation" = 60
"alert:ads_no_profile" = 60
paused = 65
"alert:budget_near_limit" = 70
# Итог теста — решение сервиса, о котором владелец должен узнать раньше сводки.
test_result = 75
summary = 80
last_action = 90
test_offer = 85
test_preparing = 88
test_running = 88
