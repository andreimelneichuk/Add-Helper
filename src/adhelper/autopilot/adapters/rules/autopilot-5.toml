# autopilot-5: пороги autopilot-2, защита от раннего «неэффективно», тест на две недели и признак «кампания упирается в лимит» (docs/04-autopilot.md §4).
# Без признака рост лимита эффективной кампании не планировался никогда.
# Изменение порогов = новая версия файла. Значения не откалиброваны: калибровка на пилоте (T7).
version = "autopilot-5"

# Доли и вероятности в базисных пунктах: 10000 = 100%.
maturity_days = 2
learning_days = 7
learning_target_multiple = 2
prior_weight = 1

good_probability_bp = 8000
bad_probability_bp = 9000
bad_cpl_multiple_bp = 13000
bad_min_spend_multiple = 3
# Меньше 40 кликов «неэффективным» не признаём: при конверсии 3–5% это 1–2 обращения в среднем.
bad_min_clicks = 40

min_change_gap_days = 3
budget_increase_bp = 2000

health_recent_days = 7
health_min_clicks = 50
health_min_visit_share_bp = 5000
health_min_expected_leads = 5
health_gap_share_bp = 3000

# Тест предлагается пограничному объявлению, если дневной лимит направления за test_days
# покрывает test_min_target_multiple целевых цен обращения: на вариант придётся хотя бы две.
# Две недели вместо одной: на малом бюджете тест не упирается в правило «бюджет мал».
test_days = 14
test_min_target_multiple = 4
# Владелец отказался от теста — две недели не предлагаем его этому объявлению снова.
test_decline_hold_days = 14

# Кампания упирается в лимит, если за прошедшую часть периода потратила не меньше 90% от
# равномерного темпа: площадка сдерживает показы деньгами, и рост лимита даст ей обращения.
budget_limited_pace_bp = 9000
