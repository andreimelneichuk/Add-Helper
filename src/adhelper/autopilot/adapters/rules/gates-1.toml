# gates-1: пороги ворот этапа 9.
# Значения ЗАДАЁТ ВЛАДЕЛЕЦ ПРОЕКТА. Ниже безопасные по умолчанию, не откалиброванные.
# Пока confirmed_by_owner = false, отчёт показывает числа, но вердикт «пройдено» не выносит.
# Изменение порога = новый файл gates-2.toml, симулятор до и после, запись решения владельца.
version = "gates-1"

# Автооткатов не больше 10% самостоятельных действий за неделю (базисные пункты).
max_rollback_share_bp = 1000
# Принятых владельцем предложений не меньше 60%.
min_accepted_share_bp = 6000
# Пропущенных часовых тиков воркера за неделю не больше двух.
max_missed_ticks = 2
confirmed_by_owner = false
