# policy-1: жёсткие рамки автоматических действий (docs/04-autopilot.md §7).
# Изменение порогов = новая версия файла. Значения не откалиброваны: сначала тень и «Предлагает».
version = "policy-1"

# Не больше стольких самостоятельных изменений за сутки на кабинет.
max_changes_per_day = 3
# Рост и перенос лимитов за 7 дней не больше 20% рабочего бюджета (базисные пункты).
max_weekly_move_bp = 2000
# Лимит кампании с автостратегией чаще раза в 14 дней не трогаем.
auto_strategy_interval_days = 14
# Паузу объявлению даём, только если в группе активных не меньше двух.
min_group_active_ads = 2
# Объявление моложе недели в обучении.
ad_learning_days = 7
# Меньше баллов API: оптимизацию откладываем, контроль бюджета продолжается.
min_api_points = 500
