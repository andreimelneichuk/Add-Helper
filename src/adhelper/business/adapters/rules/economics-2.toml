# economics-2: допустимая цена обращения из экономики бизнеса.
# Значения-ориентиры малого салона. Пока владелец их не подтвердил, показываем «ориентир».
# Это оценка по опыту рынка, не замер: прежние 30% × 30% давали для чека 1 800 ₽ цену 105 ₽,
# в несколько раз ниже той, что реально выходит в Директе, и автопилот отключал бы нормальные
# объявления. Цифры держат в уме, что клиент приходит не один раз, а реклама окупается за год.
version = "economics-2"
# Из обращений становятся клиентами столько: 40%. Обращается тот, кто уже выбрал салон.
lead_to_client_bp = 4000
# Прибыль с чека после расходов на услугу и мастера: 50%.
margin_bp = 5000
# Повторные визиты клиента за год: один визит сверх первого (+100%).
repeat_bp = 10000
# Какую долю годовой прибыли с нового клиента владелец готов отдать за его приход: 50%.
ad_share_bp = 5000
# Больше трёх повторных визитов сверх первого не считаем.
max_repeat_bp = 30000
max_capacity_per_week = 1000
