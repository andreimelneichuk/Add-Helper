# economics-1: допустимая цена обращения из экономики бизнеса.
# Это значения-ориентиры малого салона: пока владелец их не подтвердил, показываем «ориентир».
version = "economics-1"
# Из обращений становятся клиентами столько: 30%.
lead_to_client_bp = 3000
# Прибыль с чека после расходов на услугу: 50%.
margin_bp = 5000
# Повторные визиты клиента: 30% сверх первого.
repeat_bp = 3000
# Какую долю прибыли с клиента владелец готов тратить на рекламу: 30%.
ad_share_bp = 3000
# Больше трёх повторных визитов сверх первого не считаем.
max_repeat_bp = 30000
max_capacity_per_week = 1000
