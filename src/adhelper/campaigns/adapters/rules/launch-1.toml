# Запуск рекламы из мастера. Изменение порогов = новая версия.
version = "launch-1"

# Бюджетный период по умолчанию: 30 дней от полуночи по Москве.
period_days = 30

# Директ: бюджет на период не меньше 50 ₽ в день [Втор]. Точный минимум даст
# Dictionaries.get в T5.
min_daily_rubles = 50

# Стартовая гипотеза: с этой суммы поиск и сети
# идут отдельными кампаниями, чтобы переносить бюджет между ними. Калибруем на пилоте.
split_from_monthly_rubles = 30000

# Мест для объявлений в группе: 2–3.
max_ads_per_campaign = 3

# Город в адресе профиля → номер региона Яндекса (как в targeting-1). Сверить с
# Dictionaries.get GeoRegions в T5 (S12). Нет города в списке — запуск просит указать его.
[cities]
"Москва" = 213
"Санкт-Петербург" = 2
"Петербург" = 2
"Екатеринбург" = 54
"Новосибирск" = 65
"Казань" = 43
"Нижний Новгород" = 47
"Краснодар" = 35
"Ростов-на-Дону" = 39
"Самара" = 51
