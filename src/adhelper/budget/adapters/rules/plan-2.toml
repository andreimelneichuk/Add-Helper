# plan-2: пределы суммы в месяц, которую владелец выбирает в мастере запуска до входа.
version = "plan-2"

# Директ: бюджет на период не меньше 50 ₽ в день [Втор]; период запуска 30 дней (launch-1),
# резерв 10% (budget-1) не раздаём: 1 500 ₽ / 0,9 = 1 667 ₽. В plan-1 было 1 550 ₽, и запуск
# отказал бы такому плану. Точный минимум даст Dictionaries.get в T5.
min_monthly_rubles = 1667
# Защита от лишнего нуля: такую сумму малый бизнес вводит по ошибке, а не по плану.
max_monthly_rubles = 1000000
# Готовые варианты на экране. Прогноз обращений к ним не приписываем: его считает Яндекс.
presets = [15000, 20000, 25000]
