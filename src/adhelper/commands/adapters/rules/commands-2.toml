# Разбор команд чата.
# От commands-1 отличается несколькими просьбами в одном сообщении (задача 12):
# «убавь бюджет до 10к и отключи рекламу с педикюром» — две команды, каждая со своим «да».
version = "commands-2"
# Длиннее — просим написать одну просьбу коротко: длинный текст чаще смешивает несколько.
max_chars = 300
# Ответ — один короткий JSON.
model_max_tokens = 300
# Модель зовётся, только когда правила не узнали просьбу. Предел на бизнес в сутки.
model_calls_per_day = 50
# Просьб в одном сообщении. Больше — просим писать по одной: длинную цепочку легко понять
# не так, а каждую владелец подтверждает отдельно.
max_requests = 3
# Бюджет месяца выше этой суммы из чата не ставим (рублей): сумму такого размера меняют в настройках.
max_budget = 500000
# Вопрос «Применить?» действует 10 минут, потом просим написать просьбу заново.
confirm_ttl_seconds = 600
