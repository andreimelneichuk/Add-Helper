  "лучший", "лучшая", "лучшее", "лучшие", "самый", "самая", "самое", "самые",
  "гарантия", "гарантируем", "гарантированно", "№1", "номер один", "вылечим", "вылечит",
  "излечит", "исцелит", "навсегда", "без боли", "первый в городе",
]
# Такие слова означают обещание, поэтому должны буквально встречаться в профиле.
fact_words = ["скидка", "скидку", "скидки", "бесплатно", "бесплатный", "бесплатная", "подарок", "акция", "отзыв", "отзывы", "сертификат", "лицензия"]
