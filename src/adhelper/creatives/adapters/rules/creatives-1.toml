# Лимиты площадки: docs/00-research.md, ResponsiveAd. Порог похожести и токены условные.
version = "creatives-1"

headline_max = 56
text_max = 81
narrow_max = 15
narrow_chars = ".,;:!\""
similarity_max_bp = 7000
max_tokens_per_set = 6000
max_model_attempts = 2
min_contrast_x100 = 450

