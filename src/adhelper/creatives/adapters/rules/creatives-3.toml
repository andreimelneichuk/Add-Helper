# creatives-3: рамка писателя. Фрагмент-факт — только слова своего факта
# и служебные слова, факт с числом целиком, вне фактов нет слов-свойств бизнеса.
# creatives-2: слова-обещания сверяются по началу слова, а не по точной форме.
# Замер: evals/.
# Лимиты площадки, ResponsiveAd. Порог похожести и токены условные.
version = "creatives-3"

headline_max = 56
text_max = 81
narrow_max = 15
narrow_chars = ".,;:!\""
similarity_max_bp = 7000
max_tokens_per_set = 6000
max_model_attempts = 2
# Бюджет одного вызова судьи на объявление. Не хватило токенов — объявление не проходит.
judge_max_tokens = 700
min_contrast_x100 = 450
# Наборов на бизнес за скользящие сутки. Поле добавлено позже, на проверку текста не влияет.
max_sets_per_day = 5

# Автоматическая проверка без юридической гарантии
forbidden_words = [
  "лучший", "лучшая", "лучшее", "лучшие", "самый", "самая", "самое", "самые",
  "гарантия", "гарантируем", "гарантированно", "№1", "номер один", "вылечим", "вылечит",
  "излечит", "исцелит", "навсегда", "без боли", "первый в городе",
]
# Слово с таким началом означает обещание, поэтому слово с тем же началом должно быть в профиле.
fact_words = []
fact_stems = ["скидк", "бесплатн", "подар", "акци", "отзыв", "сертификат", "лицензи"]
sensitive_niches = ["косметология", "медицина", "стоматология", "массаж лечебный"]

# Служебные слова, которые можно добавить к факту, не меняя его смысла. «от», «до», «не»,
# «без», «только», «кроме», «всего» сюда не входят: они меняют условие.
fact_glue = [
  "в", "во", "на", "за", "с", "со", "у", "к", "ко", "по", "и", "для", "из", "о", "об",
  "мы", "нас", "наш", "наша", "наше", "наши", "вас", "вам", "ваш", "ваша", "это", "здесь",
  "руб", "рубль", "рубля", "рублей", "р", "цена", "стоимость", "стоит", "адрес",
  "услуга", "услуги", "услугу", "услугой",
]
# Начала слов, которые говорят о бизнесе: график, выезд, сроки, условия. Вне фрагмента-факта
# такое слово снимает объявление, внутри фрагмента его проверяет сверка со словами факта.
claim_stems = [
  "ежедневн", "круглосуточ", "выходн", "будн", "понедельн", "вторник", "среду", "средам", "четверг",
  "пятниц", "суббот", "воскресен", "утр", "вечер", "ночь", "ночн", "без", "выезд", "выезж",
  "приезжаю", "приезжаем", "приедем", "приеду", "приедет", "на дом", "доставк", "достав", "онлайн", "срочн", "под ключ", "рассрочк",
  "частями", "договор", "опыт", "лет", "минут", "час", "недел", "сутк", "гарант", "сертифиц",
  "очеред", "предоплат", "оплат", "смет",
  # Обещание результата и проверяемые свойства: судья снимал их чаще всего (val, 2026-11-04).
  "снова", "будет", "будут", "станет", "станут", "верн", "свеж", "натурал", "идеальн", "свободн", "наличи", "мест много", "много мест", "мест мало", "мест нет",
]
