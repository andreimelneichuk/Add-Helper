# moderation-1: что делать с отказом Яндекса.
# Слова причин составлены по правилам модерации Директа без реального отказа: сверить в T5.
version = "moderation-1"
# Сколько раз чиним цепочку объявлений, прежде чем просить владельца.
max_repairs = 2

[[kinds]]
code = "superlatives"
stems = ["превосход", "сравнен", "лучш", "№1", "номер один"]
repairable = true
wish = "Яндекс не принял превосходные степени и сравнения. Перепиши без «лучший», «самый» и сравнений с другими; факты оставь прежними."
owner_text = "Яндекс не принимает слова вроде «лучший» и «самый»"

[[kinds]]
code = "typography"
stems = ["заглавн", "прописн", "восклиц", "пунктуац", "орфограф", "грамматич"]
repairable = true
wish = "Яндекс не принял оформление текста. Пиши обычными буквами, без слов целиком заглавными и без восклицательных знаков; факты оставь прежними."
owner_text = "Яндексу не понравилось оформление текста: заглавные буквы или знаки"

[[kinds]]
code = "unverified_claim"
stems = ["недостовер", "подтвержд", "гарант", "обещан"]
repairable = true
wish = "Яндекс попросил подтвердить обещания. Убери гарантии и обещания результата, оставь только услуги, цены и адрес из профиля."
owner_text = "Яндекс попросил убрать обещания, которые нельзя подтвердить"

[[kinds]]
code = "landing"
stems = ["сайт", "страниц", "ссылк", "посадочн", "недоступ"]
repairable = false
wish = ""
owner_text = "Яндексу не подошла страница сайта, куда ведёт объявление: проверьте, что сайт открывается и на нём есть цены и адрес"

[[kinds]]
code = "documents"
stems = ["лиценз", "документ", "медицин", "противопоказ", "сертифик"]
repairable = false
wish = ""
owner_text = "Для такой рекламы Яндекс просит документы, например лицензию. Их загружают в кабинете Яндекса"

# Запасной вид: причину не узнали. Ремонт пробуем, но владельцу показываем текст Яндекса.
[[kinds]]
code = "other"
stems = []
repairable = true
wish = "Яндекс отклонил объявление. Перепиши проще и спокойнее: без оценок, обещаний и сравнений, только услуги, цены и адрес из профиля."
owner_text = "Яндекс отклонил объявление"
