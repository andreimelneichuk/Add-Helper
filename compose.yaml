name: ad-helper

x-app: &app
  build: .
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adhelper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: adhelper
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhelper -d adhelper"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    command:
      - uvicorn
      - --factory
      - adhelper.api.app:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *app
    command:
      - procrastinate
      - --app=adhelper.worker.app.app
      - worker
      - --queues=budget
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
